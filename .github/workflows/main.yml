on:
  push:
    branches:
      - main
name: 🚀 Deploy BODARE Pension House website on push
jobs:
  web-deploy:
    name: 🎉 Deploy BODARE Pension House Livesite Server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: bodare-pension-house-debug-apk
        path: mobile/dist/bodare-pension-house-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: pensionhouse.bodarempc.com
        username: ${{ secrets.ftp_username }}
        password: ${{ secrets.ftp_password }}
        server-dir: /
        exclude: |
          **/.git*
          **/.git*/**
          **/application/cache/**
          **/application/config/database.php
          **/.buildpath/**
          .ftp-deploy-sync-state.json
          .git-ftp.log
          .htaccess
          .project
          **/mobile/node_modules/**
          **/mobile/android/**
          **/mobile/ios/**
          **/mobile/.tools/**
          **/mobile/www/**
          **/.github/**
